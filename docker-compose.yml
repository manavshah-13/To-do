services:
  # ============================================================================
  # Application Service: To-Do List Web Application (NGINX + Static Assets)
  # ============================================================================
  todo-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-stage
    container_name: todo-list-application
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_TITLE=${APP_TITLE:-To-Do List Application}
      - API_BASE_URL=${API_BASE_URL:-}
      - ENABLE_VOICE_COMMANDS=${ENABLE_VOICE_COMMANDS:-true}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  # ============================================================================
  # Optional Database Service (Profiles: backend/fullstack)
  # Prepared for future backend API integration (e.g., Node/Express or Python)
  # ============================================================================
  database:
    image: mongo:7.0
    container_name: todo-list-db
    restart: unless-stopped
    profiles:
      - fullstack
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD:-secretpassword123}
      - MONGO_INITDB_DATABASE=tododb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local

