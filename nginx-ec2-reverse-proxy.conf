# ==============================================================================
# Host NGINX Reverse Proxy Configuration for EC2 Deployment
# Location on EC2: /etc/nginx/conf.d/todo-app.conf (or /etc/nginx/sites-available/todo-app)
# ==============================================================================

# Upstream pointing to local Docker container on port 8080
upstream todo_app_upstream {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP Server: Redirect all traffic to HTTPS (or serve directly if SSL not yet configured)
server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name e.g. todo.yourdomain.com

    # Health check bypass for AWS ALB or EC2 status checks
    location = /health {
        proxy_pass http://todo_app_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Location for Certbot Let's Encrypt domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Pass all traffic to the container upstream
    location / {
        proxy_pass http://todo_app_upstream;
        proxy_http_version 1.1;
        
        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}

